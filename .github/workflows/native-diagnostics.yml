name: Native integration diagnostics

on:
  push:
    branches: [dev_0.13.0/feature/technical-debt-release]
    paths: [.github/workflows/native-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-intake-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-contract-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: aeroCRM_services/apps/crm-intake/pnpm-lock.yaml
      - name: Create isolated CRM Intake database and roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_admin() {
            docker exec -i -e PGPASSWORD=local-contract-only "$PG_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$1" "${@:2}"
          }
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_migration LOGIN PASSWORD 'local-migration-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_runtime LOGIN PASSWORD 'local-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_backup LOGIN PASSWORD 'local-backup-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c 'CREATE DATABASE aerocrm_crm_intake_test OWNER aerocrm_crm_intake_migration'
          psql_admin aerocrm_crm_intake_test -c 'CREATE SCHEMA crm_intake AUTHORIZATION aerocrm_crm_intake_migration'
          psql_admin aerocrm_crm_intake_test -c 'GRANT CONNECT ON DATABASE aerocrm_crm_intake_test TO aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup; GRANT USAGE ON SCHEMA crm_intake TO aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup'
          psql_admin aerocrm_crm_intake_test -c 'CREATE SCHEMA foreign_service_guard AUTHORIZATION postgres; CREATE TABLE foreign_service_guard.sentinel (id integer PRIMARY KEY); INSERT INTO foreign_service_guard.sentinel VALUES (1)'
      - name: Apply migrations and production-equivalent runtime ACL
        working-directory: aeroCRM_services/apps/crm-intake
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CRM_INTAKE_DATABASE_URL: postgresql://aerocrm_crm_intake_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm prisma:migrate:deploy
          pnpm prisma:generate
          pnpm build
          node --input-type=module > "$RUNNER_TEMP/crm-intake-native-acl.sql" <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('prisma/database-access.json', 'utf8'));
          if (manifest.version !== 1 || manifest.service !== 'crm-intake' ||
              !Array.isArray(manifest.routineExecute) ||
              JSON.stringify(manifest.routineExecute) !== JSON.stringify(['assert_workspace_open(uuid)'])) {
            throw new Error('CRM Intake ACL manifest identity mismatch');
          }
          const ident = value => {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(value)) throw new Error('Invalid ACL identifier');
            return '"' + value + '"';
          };
          const sql = ['BEGIN;', "SET LOCAL lock_timeout='5s';", "SET LOCAL statement_timeout='30s';",
            'REVOKE ALL ON ALL TABLES IN SCHEMA crm_intake FROM PUBLIC, aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup;',
            'REVOKE ALL ON ALL FUNCTIONS IN SCHEMA crm_intake FROM PUBLIC, aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup;'];
          for (const [table, privileges] of Object.entries(manifest.tables)) {
            if (!Array.isArray(privileges) || privileges.some(p => !['SELECT','INSERT','UPDATE','DELETE'].includes(p))) {
              throw new Error('Invalid CRM Intake table ACL');
            }
            const relation = `${ident('crm_intake')}.${ident(table)}`;
            if (privileges.length) sql.push(`GRANT ${privileges.join(', ')} ON TABLE ${relation} TO aerocrm_crm_intake_runtime;`);
            sql.push(`GRANT SELECT ON TABLE ${relation} TO aerocrm_crm_intake_backup;`);
          }
          for (const signature of manifest.routineExecute) {
            const match = /^([A-Za-z_][A-Za-z0-9_]*)\((uuid|text|text\[\])\)$/.exec(signature);
            if (!match || !manifest.routines.includes(match[1])) throw new Error('Invalid CRM Intake routine ACL');
            sql.push(`GRANT EXECUTE ON FUNCTION ${ident('crm_intake')}.${ident(match[1])}(${match[2]}) TO aerocrm_crm_intake_runtime;`);
          }
          sql.push('COMMIT;');
          process.stdout.write(sql.join('\n') + '\n');
          NODE
          docker exec -i -e PGPASSWORD=local-migration-only "$PG_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U aerocrm_crm_intake_migration \
            -d aerocrm_crm_intake_test < "$RUNNER_TEMP/crm-intake-native-acl.sql"
      - name: Record bounded native build details
        working-directory: aeroCRM_services/apps/crm-intake
        run: |
          printf 'runner: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          node --version
          openssl version
          pnpm exec prisma --version
          sha256sum node_modules/@prisma/crm-intake-client/libquery_engine-debian-openssl-3.0.x.so.node
      - name: Compare frozen failing startup with serial connections
        working-directory: aeroCRM_services/apps/crm-intake
        env:
          CRM_INTAKE_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: postgresql://aerocrm_crm_intake_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          BASELINE_SHA: c4caac4cbf925d43a2eaf7f182d2c6b8f38480fc
        run: |
          set -euo pipefail
          # The captured acceptance suite made these two constructors before its first query.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const source = execFileSync('git', [
            'show',
            `${process.env.BASELINE_SHA}:aeroCRM_services/apps/crm-intake/test/integration/acceptance-postgres18.integration.mjs`
          ], { encoding: 'utf8' });
          assert.match(source, /const runtime = new PrismaClient\(\{\s*datasources: \{ db: \{ url: runtimeUrl \} \}\s*\}\);\s*const migrator = new PrismaClient\(\{\s*datasources: \{ db: \{ url: migrationUrl \} \}\s*\}\);/);
          console.log(`Frozen startup source: ${process.env.BASELINE_SHA}`);
          NODE
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/native-core-%p"
          ulimit -c unlimited
          probe=$(cat <<'NODE'
          import { PrismaClient } from '@prisma/crm-intake-client';
          const runtime = new PrismaClient({ datasources: { db: { url: process.env.CRM_INTAKE_TEST_DATABASE_URL } } });
          let migrator;
          try {
            if (process.env.NATIVE_PROBE_VARIANT === 'serial') await runtime.$connect();
            migrator = new PrismaClient({ datasources: { db: { url: process.env.CRM_INTAKE_TEST_MIGRATION_DATABASE_URL } } });
            if (process.env.NATIVE_PROBE_VARIANT === 'serial') await migrator.$connect();
            await runtime.$queryRawUnsafe('SELECT 1');
            await migrator.$queryRawUnsafe('SELECT 1');
          } finally {
            await Promise.all([runtime, migrator].filter(Boolean).map(client => client.$disconnect()));
          }
          NODE
          )
          capture_core() {
            local label="$1"
            shopt -s nullglob
            local cores=("$RUNNER_TEMP"/native-core-*)
            if [ "${#cores[@]}" -gt 0 ] && [ ! -f "$RUNNER_TEMP/native-${label}-first.core" ]; then
              mv "${cores[0]}" "$RUNNER_TEMP/native-${label}-first.core"
            fi
            rm -f "${cores[@]}"
          }
          baseline_crashes=0
          baseline_other_failures=0
          for attempt in {1..200}; do
            set +e
            NATIVE_PROBE_VARIANT=baseline node --input-type=module -e "$probe"
            status=$?
            set -e
            if [ "$status" -eq 139 ]; then
              baseline_crashes=$((baseline_crashes + 1))
              capture_core baseline
            elif [ "$status" -ne 0 ]; then
              baseline_other_failures=$((baseline_other_failures + 1))
              capture_core baseline
            fi
          done
          printf 'Baseline: 200 fresh processes, SIGSEGV=%s, other failures=%s\n' "$baseline_crashes" "$baseline_other_failures"
          printf '### Native startup probes\n- Source: `%s`\n- Runtime: Node 24.21.0, Prisma 5.22.0, Ubuntu 24.04, PostgreSQL 18\n- Baseline: 200 starts, SIGSEGV %s, other failures %s\n' \
            "$BASELINE_SHA" "$baseline_crashes" "$baseline_other_failures" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..200}; do
            set +e
            NATIVE_PROBE_VARIANT=serial node --input-type=module -e "$probe"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              capture_core serial
              printf -- '- Serial candidate: failed on start %s of 200 (exit %s)\n' "$attempt" "$status" >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            fi
          done
          printf -- '- Serial candidate: 200/200 starts passed\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$baseline_other_failures" -ne 0 ]; then
            echo 'Baseline had non-SIGSEGV failures; comparison is invalid' >&2
            exit 1
          fi
      - name: Repeat real Intake, CSV and acceptance integrations
        working-directory: aeroCRM_services/apps/crm-intake
        env:
          CRM_INTAKE_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: postgresql://aerocrm_crm_intake_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_RUNTIME_ROLE: aerocrm_crm_intake_runtime
          CRM_INTAKE_INTEGRATION_ALLOW_MUTATION: 'true'
        run: |
          set -euo pipefail
          ulimit -c unlimited
          for attempt in {1..30}; do
            for scenario in intake csv acceptance; do
              printf 'Real Intake integration: cycle %s/30, %s\n' "$attempt" "$scenario"
              set +e
              CRM_INTAKE_DATABASE_URL="$CRM_INTAKE_TEST_DATABASE_URL" node "test/integration/${scenario}-postgres18.integration.mjs"
              status=$?
              set -e
              if [ "$status" -ne 0 ]; then
                shopt -s nullglob
                cores=("$RUNNER_TEMP"/native-core-*)
                if [ "${#cores[@]}" -gt 0 ]; then
                  mv "${cores[0]}" "$RUNNER_TEMP/native-intake-first.core"
                  rm -f "${cores[@]}"
                fi
                printf -- '- Real Intake: failed cycle %s, %s (exit %s)\n' "$attempt" "$scenario" "$status" >> "$GITHUB_STEP_SUMMARY"
                exit "$status"
              fi
            done
          done
          printf -- '- Real Intake: 30/30 cycles of intake, csv, acceptance passed\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Print first native stack and delete cores
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          trap 'rm -f "$RUNNER_TEMP"/native-*-first.core "$RUNNER_TEMP"/native-core-*' EXIT
          cores=("$RUNNER_TEMP"/native-*-first.core "$RUNNER_TEMP"/native-core-*)
          if [ "${#cores[@]}" -eq 0 ]; then
            echo 'No native core captured'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
          for core in "${cores[@]}"; do
            printf 'Postmortem stack: %s\n' "$(basename "$core")"
            gdb -q -nx --batch -ex 'set pagination off' \
              -ex 'set print frame-arguments none' -ex 'thread apply all bt 12' \
              "$(command -v node)" "$core" || true
            rm -f "$core"
          done
  crm-sales-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-contract-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: aeroCRM_services/apps/crm-sales/pnpm-lock.yaml
      - name: Create isolated CRM Sales database and roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_admin() {
            docker exec -i -e PGPASSWORD=local-contract-only "$PG_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$1" "${@:2}"
          }
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_sales_migration LOGIN PASSWORD 'local-migration-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_sales_runtime LOGIN PASSWORD 'local-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_sales_backup LOGIN PASSWORD 'local-backup-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c 'CREATE DATABASE aerocrm_crm_sales_test OWNER aerocrm_crm_sales_migration'
          psql_admin aerocrm_crm_sales_test -c 'CREATE SCHEMA crm_sales AUTHORIZATION aerocrm_crm_sales_migration'
          psql_admin aerocrm_crm_sales_test -c 'GRANT CONNECT ON DATABASE aerocrm_crm_sales_test TO aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup; GRANT USAGE ON SCHEMA crm_sales TO aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup'
          psql_admin aerocrm_crm_sales_test -c 'CREATE SCHEMA foreign_service_guard AUTHORIZATION postgres; CREATE TABLE foreign_service_guard.sentinel (id integer PRIMARY KEY); INSERT INTO foreign_service_guard.sentinel VALUES (1); REVOKE ALL ON SCHEMA foreign_service_guard FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup; REVOKE ALL ON TABLE foreign_service_guard.sentinel FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup'
      - name: Apply service-owned Prisma migrations and verify ACL inventory
        working-directory: aeroCRM_services/apps/crm-sales
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CRM_SALES_DATABASE_URL: postgresql://aerocrm_crm_sales_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_DATABASE_URL: postgresql://aerocrm_crm_sales_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_MIGRATION_URL: postgresql://aerocrm_crm_sales_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_RUNTIME_ROLE: aerocrm_crm_sales_runtime
          CRM_SALES_INTEGRATION_ALLOW_MUTATION: 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm prisma:migrate:deploy
          pnpm prisma:generate
          pnpm typecheck
          pnpm lint
          pnpm build
          node --input-type=module > /tmp/crm-sales-commerce-acl.sql <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('prisma/database-access.json', 'utf8'));
          if (manifest.version !== 1 || manifest.service !== 'crm-sales') throw new Error('CRM Sales ACL manifest identity mismatch');
          const ident = value => { if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(value)) throw new Error('Invalid ACL identifier'); return '"' + value + '"'; };
          const literal = value => "'" + value.replaceAll("'", "''") + "'";
          const tables = Object.keys(manifest.tables);
          const expectedNewPrivileges = {
            commerce_catalog_items: ['SELECT','INSERT','UPDATE'],
            commerce_deal_lines: ['SELECT','INSERT','UPDATE','DELETE'],
            commerce_quotes: ['SELECT','INSERT'],
            commerce_payments: ['SELECT','INSERT'],
            commerce_import_previews: ['SELECT','INSERT','UPDATE'],
            commerce_commands: ['SELECT','INSERT'],
            commerce_events: ['SELECT','INSERT']
          };
          const expectedNew = Object.keys(expectedNewPrivileges);
          for (const table of expectedNew) {
            if (JSON.stringify(manifest.tables[table]) !== JSON.stringify(expectedNewPrivileges[table])) throw new Error('CRM Sales commerce ACL manifest mismatch: '+table);
          }
          const sql = ['BEGIN;', "SET LOCAL lock_timeout='5s';", "SET LOCAL statement_timeout='30s';",
            'REVOKE ALL ON ALL TABLES IN SCHEMA crm_sales FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup;',
            'REVOKE ALL ON ALL FUNCTIONS IN SCHEMA crm_sales FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup;'];
          for (const [table, privileges] of Object.entries(manifest.tables)) {
            if (!Array.isArray(privileges) || privileges.some(p => !['SELECT','INSERT','UPDATE','DELETE'].includes(p))) throw new Error('Invalid CRM Sales table ACL');
            const relation = `${ident('crm_sales')}.${ident(table)}`;
            if (privileges.length) sql.push(`GRANT ${privileges.join(', ')} ON TABLE ${relation} TO aerocrm_crm_sales_runtime;`);
            sql.push(`GRANT SELECT ON TABLE ${relation} TO aerocrm_crm_sales_backup;`);
          }
          for (const type of manifest.types) {
            sql.push(`REVOKE ALL ON TYPE ${ident('crm_sales')}.${ident(type)} FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup;`);
            sql.push(`GRANT USAGE ON TYPE ${ident('crm_sales')}.${ident(type)} TO aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup;`);
          }
          if (!manifest.routines.includes('reject_commerce_immutable_mutation')) throw new Error('CRM Sales immutable-history routine missing from ACL manifest');
          sql.push('REVOKE ALL ON FUNCTION crm_sales.reject_commerce_immutable_mutation() FROM PUBLIC, aerocrm_crm_sales_runtime, aerocrm_crm_sales_backup;');
          if (!Array.isArray(manifest.routineExecute) || JSON.stringify(manifest.routineExecute) !== JSON.stringify(['assert_workspace_open(uuid)'])) throw new Error('CRM Sales executable routine manifest mismatch');
          for (const signature of manifest.routineExecute) {
            const match = /^([A-Za-z_][A-Za-z0-9_]*)\((uuid|text|text\[\])\)$/.exec(signature);
            if (!match || !manifest.routines.includes(match[1])) throw new Error('Invalid CRM Sales executable routine signature');
            sql.push(`GRANT EXECUTE ON FUNCTION ${ident('crm_sales')}.${ident(match[1])}(${match[2]}) TO aerocrm_crm_sales_runtime;`);
          }
          sql.push(`DO $verify$ BEGIN IF (SELECT array_agg(c.relname::text ORDER BY c.relname::text) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='crm_sales' AND c.relkind IN ('r','p','v','m','f')) IS DISTINCT FROM ARRAY[${tables.map(literal).sort().join(',')}]::text[] THEN RAISE EXCEPTION 'CRM Sales table inventory mismatch'; END IF;`);
          sql.push(`IF (SELECT coalesce(array_agg(c.relname::text ORDER BY c.relname::text),'{}'::text[]) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='crm_sales' AND c.relkind='S') IS DISTINCT FROM ARRAY[${Object.keys(manifest.sequences).map(literal).sort().join(',')}]::text[] THEN RAISE EXCEPTION 'CRM Sales sequence inventory mismatch'; END IF;`);
          sql.push(`IF (SELECT coalesce(array_agg(t.typname::text ORDER BY t.typname::text),'{}'::text[]) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='crm_sales' AND t.typtype='e') IS DISTINCT FROM ARRAY[${manifest.types.map(literal).sort().join(',')}]::text[] THEN RAISE EXCEPTION 'CRM Sales enum inventory mismatch'; END IF;`);
          sql.push(`IF (SELECT coalesce(array_agg(DISTINCT p.proname::text ORDER BY p.proname::text),'{}'::text[]) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='crm_sales') IS DISTINCT FROM ARRAY[${manifest.routines.map(literal).sort().join(',')}]::text[] THEN RAISE EXCEPTION 'CRM Sales routine inventory mismatch'; END IF;`);
          for (const table of expectedNew) {
            const privileges = manifest.tables[table];
            for (const privilege of ['SELECT','INSERT','UPDATE','DELETE']) {
              sql.push(`IF has_table_privilege('aerocrm_crm_sales_runtime',${literal('crm_sales.'+table)},${literal(privilege)}) IS DISTINCT FROM ${privileges.includes(privilege)} THEN RAISE EXCEPTION 'CRM Sales runtime ACL mismatch: ${table} ${privilege}'; END IF;`);
            }
            sql.push(`IF NOT has_table_privilege('aerocrm_crm_sales_backup',${literal('crm_sales.'+table)},'SELECT') OR has_table_privilege('aerocrm_crm_sales_backup',${literal('crm_sales.'+table)},'INSERT,UPDATE,DELETE') THEN RAISE EXCEPTION 'CRM Sales backup ACL mismatch: ${table}'; END IF;`);
          }
          sql.push(`IF has_function_privilege('aerocrm_crm_sales_runtime','crm_sales.reject_commerce_immutable_mutation()','EXECUTE') OR has_function_privilege('aerocrm_crm_sales_backup','crm_sales.reject_commerce_immutable_mutation()','EXECUTE') OR EXISTS (SELECT 1 FROM pg_proc p, LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl WHERE p.oid='crm_sales.reject_commerce_immutable_mutation()'::regprocedure AND acl.grantee=0 AND acl.privilege_type='EXECUTE') THEN RAISE EXCEPTION 'CRM Sales immutable-history routine ACL mismatch'; END IF;`);
          for (const signature of manifest.routineExecute) {
            const routine = `crm_sales.${signature}`;
            sql.push(`IF NOT has_function_privilege('aerocrm_crm_sales_runtime',${literal(routine)},'EXECUTE') OR has_function_privilege('aerocrm_crm_sales_backup',${literal(routine)},'EXECUTE') OR EXISTS (SELECT 1 FROM pg_proc p, LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl WHERE p.oid=${literal(routine)}::regprocedure AND acl.grantee=0 AND acl.privilege_type='EXECUTE') THEN RAISE EXCEPTION 'CRM Sales executable routine ACL mismatch: ${signature}'; END IF;`);
          }
          sql.push('END $verify$;', 'COMMIT;');
          process.stdout.write(sql.join('\n') + '\n');
          NODE
          docker exec -i -e PGPASSWORD=local-migration-only "$PG_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U aerocrm_crm_sales_migration \
            -d aerocrm_crm_sales_test < /tmp/crm-sales-commerce-acl.sql
          docker exec -i -e PGPASSWORD=local-backup-only "$PG_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U aerocrm_crm_sales_backup \
            -d aerocrm_crm_sales_test -c 'SELECT count(*) FROM crm_sales.commerce_catalog_items'
      - name: Record Sales native build details
        working-directory: aeroCRM_services/apps/crm-sales
        run: |
          printf 'runner: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          node --version
          openssl version
          pnpm exec prisma --version
          sha256sum node_modules/@prisma/crm-sales-client/libquery_engine-debian-openssl-3.0.x.so.node
      - name: Repeat real Sales commerce, planner and workflow integrations
        working-directory: aeroCRM_services/apps/crm-sales
        env:
          CRM_SALES_DATABASE_URL: postgresql://aerocrm_crm_sales_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_DATABASE_URL: postgresql://aerocrm_crm_sales_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_MIGRATION_URL: postgresql://aerocrm_crm_sales_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_sales_test?schema=crm_sales
          CRM_SALES_TEST_RUNTIME_ROLE: aerocrm_crm_sales_runtime
          CRM_SALES_INTEGRATION_ALLOW_MUTATION: 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/native-core-%p"
          ulimit -c unlimited
          for attempt in {1..20}; do
            for scenario in sales-commerce planner-customization sales-workflow; do
              printf 'Real Sales integration: cycle %s/20, %s\n' "$attempt" "$scenario"
              set +e
              CRM_SALES_DATABASE_URL="$CRM_SALES_TEST_DATABASE_URL" node "test/integration/${scenario}-postgres18.integration.mjs"
              status=$?
              set -e
              if [ "$status" -ne 0 ]; then
                shopt -s nullglob
                cores=("$RUNNER_TEMP"/native-core-*)
                if [ "${#cores[@]}" -gt 0 ]; then
                  mv "${cores[0]}" "$RUNNER_TEMP/native-sales-first.core"
                  rm -f "${cores[@]}"
                fi
                printf -- '- Real Sales: failed cycle %s, %s (exit %s)\n' "$attempt" "$scenario" "$status" >> "$GITHUB_STEP_SUMMARY"
                exit "$status"
              fi
            done
          done
          printf '### Native Sales integrations\n- Runtime: Node 24.21.0, Prisma 5.22.0, Ubuntu 24.04, PostgreSQL 18\n- Real Sales: 20/20 cycles of commerce, planner and workflow passed\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Print Sales native stack and delete core
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          trap 'rm -f "$RUNNER_TEMP"/native-sales-first.core "$RUNNER_TEMP"/native-core-*' EXIT
          cores=("$RUNNER_TEMP"/native-sales-first.core "$RUNNER_TEMP"/native-core-*)
          if [ "${#cores[@]}" -eq 0 ]; then
            echo 'No native core captured'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
          for core in "${cores[@]}"; do
            printf 'Postmortem stack: %s\n' "$(basename "$core")"
            gdb -q -nx --batch -ex 'set pagination off' \
              -ex 'set print frame-arguments none' -ex 'thread apply all bt 12' \
              "$(command -v node)" "$core" || true
            rm -f "$core"
          done
