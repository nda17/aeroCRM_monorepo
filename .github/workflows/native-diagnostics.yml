name: Native integration diagnostics

on:
  push:
    branches: [dev_0.13.0/feature/technical-debt-release]
    paths: [.github/workflows/native-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-intake-native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '24.21.0']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-contract-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: aeroCRM_services/apps/crm-intake/pnpm-lock.yaml
      - name: Install native debugger
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
      - name: Create isolated CRM Intake database and roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_admin() {
            docker exec -i -e PGPASSWORD=local-contract-only "$PG_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$1" "${@:2}"
          }
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_migration LOGIN PASSWORD 'local-migration-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_runtime LOGIN PASSWORD 'local-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c "CREATE ROLE aerocrm_crm_intake_backup LOGIN PASSWORD 'local-backup-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql_admin postgres -c 'CREATE DATABASE aerocrm_crm_intake_test OWNER aerocrm_crm_intake_migration'
          psql_admin aerocrm_crm_intake_test -c 'CREATE SCHEMA crm_intake AUTHORIZATION aerocrm_crm_intake_migration'
          psql_admin aerocrm_crm_intake_test -c 'GRANT CONNECT ON DATABASE aerocrm_crm_intake_test TO aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup; GRANT USAGE ON SCHEMA crm_intake TO aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup'
          psql_admin aerocrm_crm_intake_test -c 'CREATE SCHEMA foreign_service_guard AUTHORIZATION postgres; CREATE TABLE foreign_service_guard.sentinel (id integer PRIMARY KEY); INSERT INTO foreign_service_guard.sentinel VALUES (1)'
      - name: Apply migrations and production-equivalent runtime ACL
        working-directory: aeroCRM_services/apps/crm-intake
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CRM_INTAKE_DATABASE_URL: postgresql://aerocrm_crm_intake_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm prisma:migrate:deploy
          pnpm prisma:generate
          pnpm build
          node --input-type=module > "$RUNNER_TEMP/crm-intake-native-acl.sql" <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('prisma/database-access.json', 'utf8'));
          if (manifest.version !== 1 || manifest.service !== 'crm-intake' ||
              !Array.isArray(manifest.routineExecute) ||
              JSON.stringify(manifest.routineExecute) !== JSON.stringify(['assert_workspace_open(uuid)'])) {
            throw new Error('CRM Intake ACL manifest identity mismatch');
          }
          const ident = value => {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(value)) throw new Error('Invalid ACL identifier');
            return '"' + value + '"';
          };
          const sql = ['BEGIN;', "SET LOCAL lock_timeout='5s';", "SET LOCAL statement_timeout='30s';",
            'REVOKE ALL ON ALL TABLES IN SCHEMA crm_intake FROM PUBLIC, aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup;',
            'REVOKE ALL ON ALL FUNCTIONS IN SCHEMA crm_intake FROM PUBLIC, aerocrm_crm_intake_runtime, aerocrm_crm_intake_backup;'];
          for (const [table, privileges] of Object.entries(manifest.tables)) {
            if (!Array.isArray(privileges) || privileges.some(p => !['SELECT','INSERT','UPDATE','DELETE'].includes(p))) {
              throw new Error('Invalid CRM Intake table ACL');
            }
            const relation = `${ident('crm_intake')}.${ident(table)}`;
            if (privileges.length) sql.push(`GRANT ${privileges.join(', ')} ON TABLE ${relation} TO aerocrm_crm_intake_runtime;`);
            sql.push(`GRANT SELECT ON TABLE ${relation} TO aerocrm_crm_intake_backup;`);
          }
          for (const signature of manifest.routineExecute) {
            const match = /^([A-Za-z_][A-Za-z0-9_]*)\((uuid|text|text\[\])\)$/.exec(signature);
            if (!match || !manifest.routines.includes(match[1])) throw new Error('Invalid CRM Intake routine ACL');
            sql.push(`GRANT EXECUTE ON FUNCTION ${ident('crm_intake')}.${ident(match[1])}(${match[2]}) TO aerocrm_crm_intake_runtime;`);
          }
          sql.push('COMMIT;');
          process.stdout.write(sql.join('\n') + '\n');
          NODE
          docker exec -i -e PGPASSWORD=local-migration-only "$PG_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U aerocrm_crm_intake_migration \
            -d aerocrm_crm_intake_test < "$RUNNER_TEMP/crm-intake-native-acl.sql"
      - name: Record bounded native build details
        working-directory: aeroCRM_services/apps/crm-intake
        run: |
          printf 'runner: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          node --version
          openssl version
          pnpm exec prisma --version
          gdb --version | head -1
      - name: Trace synthetic Intake and CSV integration under gdb
        working-directory: aeroCRM_services/apps/crm-intake
        env:
          CRM_INTAKE_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_DATABASE_URL: postgresql://aerocrm_crm_intake_runtime:local-runtime-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_MIGRATION_DATABASE_URL: postgresql://aerocrm_crm_intake_migration:local-migration-only@127.0.0.1:5432/aerocrm_crm_intake_test?schema=crm_intake
          CRM_INTAKE_TEST_RUNTIME_ROLE: aerocrm_crm_intake_runtime
          CRM_INTAKE_INTEGRATION_ALLOW_MUTATION: 'true'
        run: |
          set -euo pipefail
          ulimit -c 0
          trace() {
            local scenario="$1"
            shift
            set +e
            gdb -q -nx --batch --return-child-result \
              -ex 'set pagination off' \
              -ex 'set print frame-arguments none' \
              -ex run \
              -ex 'thread apply all bt 12' \
              --args node "$@" \
              2>&1 | tee "$RUNNER_TEMP/${scenario}-native-gdb.log"
            local gdb_status=${PIPESTATUS[0]}
            set -e
            if grep -qE 'Program received signal SIG(SEGV|ABRT)' "$RUNNER_TEMP/${scenario}-native-gdb.log"; then
              exit 139
            fi
            if [ "$gdb_status" -ne 0 ]; then
              exit "$gdb_status"
            fi
          }
          probe='const {PrismaClient}=await import("@prisma/crm-intake-client"); const url=process.env.CRM_INTAKE_TEST_DATABASE_URL; const clients=Array.from({length:2},()=>new PrismaClient({datasources:{db:{url}}})); try { await Promise.all(clients.map(client=>client.$queryRawUnsafe("SELECT 1"))); } finally { await Promise.all(clients.map(client=>client.$disconnect())); }'
          for attempt in {1..10}; do
            trace "startup-${attempt}" --input-type=module -e "$probe"
          done
          for scenario in intake csv; do
            trace "$scenario" "test/integration/${scenario}-postgres18.integration.mjs"
          done
