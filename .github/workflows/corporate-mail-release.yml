name: aeroCRM corporate mail release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green CI run ID for this exact production commit
        required: true
      sha:
        description: Full 40-character backend commit SHA
        required: true
      infra_sha:
        description: Full commit SHA of reviewed private infrastructure repo
        required: true
      backend_env_hash:
        description: Approved aggregate backend env hash after any scoped Customers change
        required: true
      apply_migration:
        description: Apply the reviewed mail migration with a full backend manifest
        type: boolean
        required: true
        default: true
      install_env:
        description: Install the reviewed three-file Customers secret bundle within the release transaction
        type: boolean
        required: true
        default: false
      backend_env_before_hash:
        description: Approved aggregate backend env hash before install_env
        required: false
      mail_env_bundle_hash:
        description: Approved SHA-256 of canonical CRM_CUSTOMERS_MAIL_ENV_BUNDLE secret
        required: false
      crm_customers_migration_env_hash:
        description: SHA-256 of private migrations/crm-customers.env; required only with apply_migration
        required: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_hash }}
      crm_mail_env_install: ${{ inputs.install_env }}
      crm_mail_env_before_hash: ${{ inputs.backend_env_before_hash }}
      crm_mail_env_bundle_hash: ${{ inputs.mail_env_bundle_hash }}
      crm_corporate_mail_migration: ${{ inputs.apply_migration }}
      crm_corporate_mail_migration_env_hash: ${{ inputs.crm_customers_migration_env_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
    secrets: inherit
