name: aeroCRM meeting 3 release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green full-backend CI run ID for this exact production commit
        required: true
      sha:
        description: Full 40-character backend commit SHA
        required: true
      infra_sha:
        description: Full commit SHA of reviewed private infrastructure repo
        required: true
      backend_env_hash:
        description: Approved aggregate backend env hash on VPS
        required: true
      migration_env_hash:
        description: SHA-256 of sorted private crm-access.env, crm-intake.env and crm-sales.env migration file hashes
        required: true
      frontend_env_hash:
        description: Approved aggregate frontend env hash on VPS
        required: true
      runtime_storage_install:
        description: Reviewed forward-only seven-object storage cutover before DDL and image switch
        required: false
        type: boolean
        default: false
      runtime_storage_before_hash:
        description: Approved backend env aggregate before the 25-value runtime storage delta
        required: false
      runtime_storage_bundle_hash:
        description: SHA-256 of canonical private CRM_RUNTIME_STORAGE_ENV_BUNDLE
        required: false
      runtime_storage_manifest_hash:
        description: SHA-256 of private seven-object inventory and frozen database reference contract
        required: false
      chat_env_install:
        description: Install separately provisioned independent Chat storage key after bounded scope probe
        type: boolean
        default: false
        required: false
      chat_env_before_hash:
        description: Approved aggregate backend env hash before Chat installation
        required: false
      chat_env_bundle_hash:
        description: Approved canonical seven-key Chat bundle SHA-256
        required: false
permissions:
  contents: read
  actions: read
jobs:
  backend:
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_hash }}
      runtime_storage_install: ${{ inputs.runtime_storage_install }}
      runtime_storage_before_hash: ${{ inputs.runtime_storage_before_hash }}
      runtime_storage_bundle_hash: ${{ inputs.runtime_storage_bundle_hash }}
      runtime_storage_manifest_hash: ${{ inputs.runtime_storage_manifest_hash }}
      crm_chat_env_install: ${{ inputs.chat_env_install }}
      crm_chat_env_before_hash: ${{ inputs.chat_env_before_hash }}
      crm_chat_env_bundle_hash: ${{ inputs.chat_env_bundle_hash }}
      crm_ux_unification_migration: false
      crm_workspace_collaboration_migration: false
      crm_meeting3_migration: true
      crm_meeting3_migration_env_hash: ${{ inputs.migration_env_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      crm_corporate_mail_migration: false
      crm_file_imports_migration: false
      crm_planner_customization_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
    secrets: inherit
  frontend:
    needs: backend
    uses: ./.github/workflows/release.yml
    with:
      target: frontend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      frontend_env_hash: ${{ inputs.frontend_env_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      crm_corporate_mail_migration: false
      crm_file_imports_migration: false
      crm_planner_customization_migration: false
      crm_ux_unification_migration: false
      crm_workspace_collaboration_migration: false
      crm_meeting3_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
    secrets: inherit
