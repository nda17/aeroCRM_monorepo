name: aeroCRM Telegram Business relay
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green CI run ID for the exact production commit
        required: true
      sha:
        description: Full 40-character production commit SHA
        required: true
      infra_sha:
        description: Full reviewed private infra commit SHA
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: aerocrm-production-release
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production CI and reviewed infra ref
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SHA: ${{ inputs.sha }}
          INFRA_SHA: ${{ inputs.infra_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/prod_0.1.0 ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$SHA" =~ ^[a-f0-9]{40}$ && "$INFRA_SHA" =~ ^[a-f0-9]{40}$ ]]
          read -r conclusion head_sha branch workflow_path <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.conclusion,.head_sha,.head_branch,.path] | join(" ")')"
          [[ "$conclusion" == success && "$head_sha" == "$SHA" && "$branch" == prod_0.1.0 && "$workflow_path" == .github/workflows/ci.yml ]]
      - uses: actions/checkout@v4
        with:
          repository: nda17/aeroCRM_infra
          ref: ${{ inputs.infra_sha }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          persist-credentials: false
          path: infra
      - name: Apply scoped relay update with rollback
        env:
          RELAY_HOST: ${{ secrets.TELEGRAM_RELAY_SSH_HOST }}
          RELAY_USER: ${{ secrets.TELEGRAM_RELAY_SSH_USER }}
          RELAY_PORT: ${{ secrets.TELEGRAM_RELAY_SSH_PORT }}
          SSHPASS: ${{ secrets.TELEGRAM_RELAY_SSH_PASSWORD }}
          RELAY_KNOWN_HOSTS: ${{ secrets.TELEGRAM_RELAY_SSH_KNOWN_HOSTS }}
          INFRA_SHA: ${{ inputs.infra_sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELAY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$RELAY_USER" == root && "$RELAY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$SSHPASS" && -n "$RELAY_KNOWN_HOSTS" ]]
          [[ "$(git -C infra rev-parse HEAD)" == "$INFRA_SHA" ]]
          python3 -m py_compile infra/scripts/telegram-business-relay.py
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > "$RUNNER_TEMP/telegram-relay-known-hosts"
          snippet_base64=$(base64 -w0 infra/nginx/telegram-bridge/telegram-webhooks.locations.conf)
          sshpass -e ssh -p "$RELAY_PORT" -o BatchMode=no -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/telegram-relay-known-hosts" -o LogLevel=ERROR \
            "$RELAY_USER@$RELAY_HOST" "TELEGRAM_SNIPPET_BASE64='$snippet_base64' python3 -" \
            < infra/scripts/telegram-business-relay.py
      - name: Remove relay authentication material
        if: always()
        run: rm -f "$RUNNER_TEMP/telegram-relay-known-hosts"
