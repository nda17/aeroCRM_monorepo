name: aeroCRM risk controls release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green full-backend production CI for exact SHA
        required: true
      sha:
        description: Exact full application SHA
        required: true
      infra_sha:
        description: Exact reviewed infrastructure SHA
        required: true
      backend_env_before_hash:
        description: Current aggregate backend env SHA-256
        required: true
      backend_env_hash:
        description: Aggregate backend env SHA-256 after marketing and exact gateway-route delta
        required: true
      migration_env_hash:
        description: SHA-256 of sorted billing/campaigns/identity migration env hashes
        required: true
permissions:
  contents: read
  actions: read
jobs:
  backend:
    if: github.ref == 'refs/heads/prod_0.1.0'
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_hash }}
      risk_controls_migration: true
      risk_controls_migration_env_hash: ${{ inputs.migration_env_hash }}
      risk_controls_env_before_hash: ${{ inputs.backend_env_before_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
    secrets: inherit
