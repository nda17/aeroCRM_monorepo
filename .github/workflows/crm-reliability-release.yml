name: aeroCRM reliability and retention release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green full-backend production CI run ID for the exact SHA
        required: true
      sha:
        description: Full 40-character production commit SHA
        required: true
      infra_sha:
        description: Full reviewed infrastructure commit SHA
        required: true
      backend_env_before_hash:
        description: Approved aggregate backend env hash before prepare
        required: true
      backend_env_prepare_hash:
        description: Approved aggregate backend env hash after prepare
        required: true
      backend_env_activate_hash:
        description: Approved aggregate backend env hash after activation
        required: true
      prepare_bundle_hash:
        description: SHA-256 of canonical private prepare env bundle
        required: true
      apk_bundle_hash:
        description: SHA-256 of canonical scoped APK publisher bundle
        required: true
      activate_bundle_hash:
        description: SHA-256 of canonical private activate env bundle
        required: true
      migration_env_hash:
        description: SHA-256 of sorted private Access and Customers migration env file hashes
        required: true

permissions:
  contents: read
  actions: read

jobs:
  s3-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Require green production CI for the probed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SHA: ${{ inputs.sha }}
          INFRA_SHA: ${{ inputs.infra_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/prod_0.1.0 ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$SHA" =~ ^[a-f0-9]{40}$ && "$INFRA_SHA" =~ ^[a-f0-9]{40}$ ]]
          read -r conclusion head_sha branch workflow_path <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.conclusion,.head_sha,.head_branch,.path] | join(" ")')"
          [[ "$conclusion" == success && "$head_sha" == "$SHA" && "$branch" == prod_0.1.0 && "$workflow_path" == .github/workflows/ci.yml ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nda17/aeroCRM_infra
          ref: ${{ inputs.infra_sha }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: source/aeroCRM_services/apps/operations/pnpm-lock.yaml
      - name: Install exact Operations S3 SDK
        working-directory: source/aeroCRM_services/apps/operations
        run: pnpm install --frozen-lockfile
      - name: Verify new Backup and APK principal capabilities
        env:
          CRM_RELIABILITY_ENV_BUNDLE: ${{ secrets.CRM_RELIABILITY_PREPARE_ENV_BUNDLE }}
          ANDROID_APK_S3_PROBE_BUNDLE: ${{ secrets.ANDROID_APK_S3_PROBE_BUNDLE }}
          PREPARE_BUNDLE_HASH: ${{ inputs.prepare_bundle_hash }}
          APK_BUNDLE_HASH: ${{ inputs.apk_bundle_hash }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/crm-reliability-prepare.json" "$RUNNER_TEMP/apk-probe.json"' EXIT
          node infra/scripts/reliability-s3-probe.mjs --policy-self-test
          node infra/scripts/backend-reliability-env.mjs --stage "$RUNNER_TEMP/crm-reliability-prepare.json" "$PREPARE_BUNDLE_HASH"
          node -e 'const fs=require("node:fs");const value=process.env.ANDROID_APK_S3_PROBE_BUNDLE||"";fs.writeFileSync(process.argv[1],value.endsWith("\n")?value:value+"\n",{mode:0o600,flag:"wx"})' "$RUNNER_TEMP/apk-probe.json"
          node infra/scripts/reliability-s3-probe.mjs --probe \
            "$PWD/source/aeroCRM_services/apps/operations/package.json" \
            "$RUNNER_TEMP/crm-reliability-prepare.json" "$PREPARE_BUNDLE_HASH" "$RUNNER_TEMP/apk-probe.json" "$APK_BUNDLE_HASH"
  prepare:
    needs: s3-probe
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_prepare_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
      crm_reliability_phase: prepare
      crm_reliability_env_before_hash: ${{ inputs.backend_env_before_hash }}
      crm_reliability_env_bundle_hash: ${{ inputs.prepare_bundle_hash }}
      crm_reliability_migration: true
      crm_reliability_migration_env_hash: ${{ inputs.migration_env_hash }}
    secrets: inherit
  activate:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_activate_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
      crm_reliability_phase: activate
      crm_reliability_env_before_hash: ${{ inputs.backend_env_prepare_hash }}
      crm_reliability_env_bundle_hash: ${{ inputs.activate_bundle_hash }}
    secrets: inherit
