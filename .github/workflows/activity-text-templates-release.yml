name: aeroCRM activity text templates release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Green full-backend CI run ID for this exact production commit
        required: true
      sha:
        description: Full 40-character production commit SHA
        required: true
      infra_sha:
        description: Full commit SHA of reviewed private infrastructure repo
        required: true
      backend_env_hash:
        description: Approved aggregate backend env hash on VPS
        required: true
      crm_sales_migration_env_hash:
        description: SHA-256 of private VPS migrations/crm-sales.env
        required: true

permissions:
  contents: read
  actions: read

jobs:
  backend:
    if: github.ref == 'refs/heads/prod_0.1.0'
    uses: ./.github/workflows/release.yml
    with:
      target: backend
      ci_run_id: ${{ inputs.ci_run_id }}
      sha: ${{ inputs.sha }}
      infra_sha: ${{ inputs.infra_sha }}
      backend_env_hash: ${{ inputs.backend_env_hash }}
      crm_sales_activity_text_templates_migration: true
      crm_sales_activity_text_templates_migration_env_hash: ${{ inputs.crm_sales_migration_env_hash }}
      billing_capacity_migration: false
      crm_custom_roles_migration: false
      crm_sales_commerce_migration: false
      crm_intake_notifications_migration: false
      workspace_closure_migration: false
      workspace_closure_identity_acl_repair: false
      workspace_closure_enable: false
      crm_contracts_cutover: false
      crm_contracts_cutover_resume: false
    secrets: inherit
