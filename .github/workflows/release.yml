name: aeroCRM release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [backend, frontend]
        default: backend
        required: true
      ci_run_id:
        description: Green CI run ID for this exact commit
        required: true
      sha:
        description: Full 40-character commit SHA
        required: true
      frontend_env_hash:
        description: SHA-256 of sorted frontend env-file hashes on VPS
        required: false
      infra_sha:
        description: Full commit SHA of reviewed private infra repo
        required: true
      backend_env_hash:
        description: SHA-256 of sorted backend env-file hashes on VPS
        required: false
      billing_capacity_migration:
        description: Backend target only; apply reviewed Billing capacity and administrative-seat migrations before switching images
        type: boolean
        default: false
        required: true
      billing_migration_env_hash:
        description: SHA-256 of the private VPS migrations/billing.env file; required only for Billing capacity migration
        required: false
      crm_custom_roles_migration:
        description: Backend target only; apply reviewed CRM Access custom-role and administrative-seat migrations with the write gate disabled
        type: boolean
        default: false
        required: true
      crm_custom_roles_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-access.env file; required only for the CRM custom-role migration
        required: false
      crm_sales_commerce_migration:
        description: Backend target only; apply the reviewed CRM Sales commerce migration before switching images
        type: boolean
        default: false
        required: true
      crm_sales_commerce_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-sales.env file; required only for the CRM Sales commerce migration
        required: false
      crm_intake_notifications_migration:
        description: Backend target only; apply the reviewed CRM Intake inbox notification ID default migration before switching images
        type: boolean
        default: false
        required: true
      crm_intake_notifications_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-intake.env file; required only for the CRM Intake notification migration
        required: false
      workspace_closure_migration:
        description: Backend target only; apply the reviewed seven-service workspace closure migration with the closure gate OFF
        type: boolean
        default: false
        required: true
      workspace_closure_migration_env_hash:
        description: SHA-256 of sorted checksums for the seven fixed private migration env files
        required: false
      workspace_closure_identity_acl_repair:
        description: Backend target only; repair the reviewed Identity workspace UPDATE grant during a closure-enabled upgrade
        type: boolean
        default: false
        required: true
      workspace_closure_identity_env_hash:
        description: SHA-256 of the private Identity migration env file; required only for the Identity ACL repair
        required: false
      workspace_closure_enable:
        description: Backend target only; enable the closure gate in three CRM Access env files before the same-SHA release
        type: boolean
        default: false
        required: true
      backend_env_before_hash:
        description: Approved aggregate backend env hash with the three closure gate values false; required only when enabling
        required: false
      crm_contracts_cutover:
        description: Backend target only; release frontend separately after a successful CRM contract cutover
        type: boolean
        default: false
        required: true
      crm_contracts_cutover_resume:
        description: Resume the same reviewed cutover after a guarded rollback
        type: boolean
        default: false
        required: true
      crm_contracts_staged_env_dir:
        description: Absolute private VPS directory containing backend/ and migrations/
        required: false
      crm_contracts_staged_env_hash:
        description: SHA-256 of sorted staged backend env-file hashes on VPS
        required: false
      crm_contracts_definitions_file:
        description: Absolute private VPS path to reviewed RabbitMQ definitions JSON
        required: false
  workflow_call:
    inputs:
      target:
        description: Deployment target
        type: string
        default: backend
        required: true
      ci_run_id:
        type: string
        description: Green CI run ID for this exact commit
        required: true
      sha:
        type: string
        description: Full 40-character commit SHA
        required: true
      frontend_env_hash:
        type: string
        description: SHA-256 of sorted frontend env-file hashes on VPS
        required: false
      infra_sha:
        type: string
        description: Full commit SHA of reviewed private infra repo
        required: true
      backend_env_hash:
        type: string
        description: SHA-256 of sorted backend env-file hashes on VPS
        required: false
      billing_capacity_migration:
        description: Backend target only; apply reviewed Billing capacity and administrative-seat migrations before switching images
        type: boolean
        default: false
        required: true
      billing_migration_env_hash:
        type: string
        description: SHA-256 of the private VPS migrations/billing.env file; required only for Billing capacity migration
        required: false
      crm_custom_roles_migration:
        description: Backend target only; apply reviewed CRM Access custom-role and administrative-seat migrations with the write gate disabled
        type: boolean
        default: false
        required: true
      crm_custom_roles_migration_env_hash:
        type: string
        description: SHA-256 of the private VPS migrations/crm-access.env file; required only for the CRM custom-role migration
        required: false
      crm_sales_commerce_migration:
        description: Backend target only; apply the reviewed CRM Sales commerce migration before switching images
        type: boolean
        default: false
        required: true
      crm_sales_commerce_migration_env_hash:
        type: string
        description: SHA-256 of the private VPS migrations/crm-sales.env file; required only for the CRM Sales commerce migration
        required: false
      crm_intake_notifications_migration:
        description: Backend target only; apply the reviewed CRM Intake inbox notification ID default migration before switching images
        type: boolean
        default: false
        required: true
      crm_intake_notifications_migration_env_hash:
        type: string
        description: SHA-256 of the private VPS migrations/crm-intake.env file; required only for the CRM Intake notification migration
        required: false
      crm_mail_env_install:
        description: Install only the three reviewed Customers env files as part of the canonical transaction
        required: false
        type: boolean
        default: false
      crm_mail_env_before_hash:
        description: Approved aggregate backend env hash before the scoped Customers change
        required: false
        type: string
      crm_mail_env_bundle_hash:
        description: Approved SHA-256 of canonical CRM_CUSTOMERS_MAIL_ENV_BUNDLE secret
        required: false
        type: string
      crm_corporate_mail_migration:
        description: Backend target only; apply the reviewed fenced corporate mail migration and ACL with a full verified image manifest
        required: false
        type: boolean
        default: false
      crm_corporate_mail_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-customers.env file; required only for corporate mail migration
        required: false
        type: string
      crm_file_imports_migration:
        description: Backend target only; apply reviewed Customers and Sales file import migrations with a full manifest
        required: false
        type: boolean
        default: false
      crm_file_imports_migration_env_hash:
        description: SHA-256 of sorted private Customers and Sales migration env file hashes
        required: false
        type: string
      crm_planner_customization_migration:
        description: Backend target only; apply reviewed planner and Identity single-session migrations with a full manifest
        required: false
        type: boolean
        default: false
      crm_planner_customization_migration_env_hash:
        description: SHA-256 of sorted private crm-sales.env and identity.env migration file hashes
        required: false
        type: string
      crm_ux_unification_migration:
        description: Backend target only; apply reviewed CRM Access and Sales UX migrations with a full manifest
        required: false
        type: boolean
        default: false
      crm_ux_unification_migration_env_hash:
        description: SHA-256 of sorted private crm-access.env and crm-sales.env migration file hashes
        required: false
        type: string
      crm_chat_env_install:
        description: Optional independent Chat storage installation; disabled until a reviewed key is provisioned
        required: false
        type: boolean
        default: false
      crm_chat_env_before_hash:
        description: Approved aggregate backend env hash before the Chat delta
        required: false
        type: string
      crm_chat_env_bundle_hash:
        description: Approved canonical seven-key CRM_ACCESS_CHAT_ENV_BUNDLE SHA-256
        required: false
        type: string
      crm_meeting3_migration:
        description: Backend only; apply reviewed Access, Intake and Sales meeting 3 migrations
        required: false
        type: boolean
        default: false
      crm_meeting3_migration_env_hash:
        description: SHA-256 of sorted private Access, Intake and Sales migration env checksums
        required: false
        type: string
      crm_workspace_collaboration_migration:
        description: Backend target only; apply reviewed CRM Access collaboration and Customers mail live migrations with a full manifest
        required: false
        type: boolean
        default: false
      crm_workspace_collaboration_migration_env_hash:
        description: SHA-256 of sorted private crm-access.env and crm-customers.env migration file hashes
        required: false
        type: string
      workspace_closure_migration:
        description: Backend target only; apply the reviewed seven-service workspace closure migration with the closure gate OFF
        type: boolean
        default: false
        required: true
      workspace_closure_migration_env_hash:
        type: string
        description: SHA-256 of sorted checksums for the seven fixed private migration env files
        required: false
      workspace_closure_identity_acl_repair:
        description: Backend target only; repair the reviewed Identity workspace UPDATE grant during a closure-enabled upgrade
        type: boolean
        default: false
        required: true
      workspace_closure_identity_env_hash:
        type: string
        description: SHA-256 of the private Identity migration env file; required only for the Identity ACL repair
        required: false
      workspace_closure_enable:
        description: Backend target only; enable the closure gate in three CRM Access env files before the same-SHA release
        type: boolean
        default: false
        required: true
      backend_env_before_hash:
        type: string
        description: Approved aggregate backend env hash with the three closure gate values false; required only when enabling
        required: false
      crm_contracts_cutover:
        description: Backend target only; release frontend separately after a successful CRM contract cutover
        type: boolean
        default: false
        required: true
      crm_contracts_cutover_resume:
        description: Resume the same reviewed cutover after a guarded rollback
        type: boolean
        default: false
        required: true
      crm_contracts_staged_env_dir:
        type: string
        description: Absolute private VPS directory containing backend/ and migrations/
        required: false
      crm_contracts_staged_env_hash:
        type: string
        description: SHA-256 of sorted staged backend env-file hashes on VPS
        required: false
      crm_contracts_definitions_file:
        type: string
        description: Absolute private VPS path to reviewed RabbitMQ definitions JSON
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: aerocrm-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Require green exact-SHA CI on production branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SHA: ${{ inputs.sha }}
          INFRA_SHA: ${{ inputs.infra_sha }}
          TARGET: ${{ inputs.target }}
          FRONT_HASH: ${{ inputs.frontend_env_hash }}
          BACK_HASH: ${{ inputs.backend_env_hash }}
          BILLING_MIGRATION: ${{ inputs.billing_capacity_migration && 'true' || 'false' }}
          BILLING_MIGRATION_HASH: ${{ inputs.billing_migration_env_hash }}
          CUSTOM_ROLES_MIGRATION: ${{ inputs.crm_custom_roles_migration && 'true' || 'false' }}
          CUSTOM_ROLES_MIGRATION_HASH: ${{ inputs.crm_custom_roles_migration_env_hash }}
          SALES_COMMERCE_MIGRATION: ${{ inputs.crm_sales_commerce_migration && 'true' || 'false' }}
          SALES_COMMERCE_MIGRATION_HASH: ${{ inputs.crm_sales_commerce_migration_env_hash }}
          INTAKE_NOTIFICATIONS_MIGRATION: ${{ inputs.crm_intake_notifications_migration && 'true' || 'false' }}
          INTAKE_NOTIFICATIONS_MIGRATION_HASH: ${{ inputs.crm_intake_notifications_migration_env_hash }}
          MAIL_MIGRATION: ${{ inputs.crm_corporate_mail_migration && 'true' || 'false' }}
          MAIL_ENV_INSTALL: ${{ inputs.crm_mail_env_install && 'true' || 'false' }}
          MAIL_ENV_BEFORE_HASH: ${{ inputs.crm_mail_env_before_hash }}
          MAIL_ENV_BUNDLE_HASH: ${{ inputs.crm_mail_env_bundle_hash }}
          CHAT_ENV_INSTALL: ${{ inputs.crm_chat_env_install && 'true' || 'false' }}
          CHAT_ENV_BEFORE_HASH: ${{ inputs.crm_chat_env_before_hash }}
          CHAT_ENV_BUNDLE_HASH: ${{ inputs.crm_chat_env_bundle_hash }}
          MAIL_MIGRATION_HASH: ${{ inputs.crm_corporate_mail_migration_env_hash }}
          FILE_IMPORTS_MIGRATION: ${{ inputs.crm_file_imports_migration && 'true' || 'false' }}
          FILE_IMPORTS_MIGRATION_HASH: ${{ inputs.crm_file_imports_migration_env_hash }}
          PLANNER_MIGRATION: ${{ inputs.crm_planner_customization_migration && 'true' || 'false' }}
          PLANNER_MIGRATION_HASH: ${{ inputs.crm_planner_customization_migration_env_hash }}
          UX_MIGRATION: ${{ inputs.crm_ux_unification_migration && 'true' || 'false' }}
          UX_MIGRATION_HASH: ${{ inputs.crm_ux_unification_migration_env_hash }}
          COLLABORATION_MIGRATION: ${{ inputs.crm_workspace_collaboration_migration && 'true' || 'false' }}
          COLLABORATION_MIGRATION_HASH: ${{ inputs.crm_workspace_collaboration_migration_env_hash }}
          MEETING3_MIGRATION: ${{ inputs.crm_meeting3_migration && 'true' || 'false' }}
          MEETING3_MIGRATION_HASH: ${{ inputs.crm_meeting3_migration_env_hash }}
          CLOSURE_MIGRATION: ${{ inputs.workspace_closure_migration && 'true' || 'false' }}
          CLOSURE_MIGRATION_HASH: ${{ inputs.workspace_closure_migration_env_hash }}
          IDENTITY_ACL_REPAIR: ${{ inputs.workspace_closure_identity_acl_repair && 'true' || 'false' }}
          IDENTITY_ENV_HASH: ${{ inputs.workspace_closure_identity_env_hash }}
          CLOSURE_ENABLE: ${{ inputs.workspace_closure_enable && 'true' || 'false' }}
          BACK_BEFORE_HASH: ${{ inputs.backend_env_before_hash }}
          CUTOVER: ${{ inputs.crm_contracts_cutover && 'true' || 'false' }}
          RESUME: ${{ inputs.crm_contracts_cutover_resume && 'true' || 'false' }}
          STAGED_DIR: ${{ inputs.crm_contracts_staged_env_dir }}
          STAGED_HASH: ${{ inputs.crm_contracts_staged_env_hash }}
          DEFINITIONS_FILE: ${{ inputs.crm_contracts_definitions_file }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INFRA_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          # The trusted production wrapper may resume an older exact pending target after the branch moves.
          [[ "$GITHUB_REF" == refs/heads/prod_0.1.0 ]]
          read -r conclusion head_sha branch workflow_path <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.conclusion,.head_sha,.head_branch,.path] | join(" ")')"
          [[ "$conclusion" == success && "$head_sha" == "$SHA" && "$branch" == prod_0.1.0 && "$workflow_path" == .github/workflows/ci.yml ]]
          if [[ "$CUTOVER" == true ]]; then
            [[ "$TARGET" == backend ]]
            [[ "$STAGED_HASH" =~ ^[a-f0-9]{64}$ ]]
            [[ "$STAGED_DIR" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEFINITIONS_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]]
            [[ "/$STAGED_DIR/" != *'/../'* && "/$DEFINITIONS_FILE/" != *'/../'* ]]
            [[ "$STAGED_DIR" != *'//'* && "$DEFINITIONS_FILE" != *'//'* ]]
          else
            [[ "$RESUME" == false && -z "$STAGED_DIR" && -z "$STAGED_HASH" && -z "$DEFINITIONS_FILE" ]]
          fi
          if [[ "$BILLING_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$BILLING_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$BILLING_MIGRATION_HASH" ]]
          fi
          [[ "$BILLING_MIGRATION" == "$CUSTOM_ROLES_MIGRATION" ]]
          if [[ "$CUSTOM_ROLES_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CUSTOM_ROLES_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$CUSTOM_ROLES_MIGRATION_HASH" ]]
          fi
          if [[ "$MAIL_ENV_INSTALL" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$CUSTOM_ROLES_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$MAIL_ENV_BEFORE_HASH" =~ ^[a-f0-9]{64}$ && "$MAIL_ENV_BUNDLE_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$MAIL_ENV_BEFORE_HASH" && -z "$MAIL_ENV_BUNDLE_HASH" ]]
          fi
          if [[ "$MAIL_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$MAIL_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$MAIL_MIGRATION" == false && -z "$MAIL_MIGRATION_HASH" ]]
          fi
          if [[ "$FILE_IMPORTS_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$SALES_COMMERCE_MIGRATION" == false &&
              "$INTAKE_NOTIFICATIONS_MIGRATION" == false && "$MAIL_MIGRATION" == false &&
              "$FILE_IMPORTS_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$FILE_IMPORTS_MIGRATION" == false && -z "$FILE_IMPORTS_MIGRATION_HASH" ]]
          fi
          if [[ "$PLANNER_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$CUSTOM_ROLES_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$MAIL_MIGRATION" == false && "$FILE_IMPORTS_MIGRATION" == false && "$MAIL_ENV_INSTALL" == false &&
              "$PLANNER_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$PLANNER_MIGRATION" == false && -z "$PLANNER_MIGRATION_HASH" ]]
          fi
          if [[ "$UX_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$CUSTOM_ROLES_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$MAIL_MIGRATION" == false && "$FILE_IMPORTS_MIGRATION" == false &&
              "$PLANNER_MIGRATION" == false && "$MAIL_ENV_INSTALL" == false &&
              "$UX_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$UX_MIGRATION" == false && -z "$UX_MIGRATION_HASH" ]]
          fi
          if [[ "$CHAT_ENV_INSTALL" == true ]]; then
            [[ "$TARGET" == backend && "$MEETING3_MIGRATION" == true && "$MAIL_ENV_INSTALL" == false &&
              "$CHAT_ENV_BEFORE_HASH" =~ ^[a-f0-9]{64}$ && "$CHAT_ENV_BUNDLE_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$CHAT_ENV_INSTALL" == false && -z "$CHAT_ENV_BEFORE_HASH" && -z "$CHAT_ENV_BUNDLE_HASH" ]]
          fi
          if [[ "$MEETING3_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$CUSTOM_ROLES_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$MAIL_MIGRATION" == false && "$FILE_IMPORTS_MIGRATION" == false &&
              "$PLANNER_MIGRATION" == false && "$UX_MIGRATION" == false &&
              "$COLLABORATION_MIGRATION" == false && "$MAIL_ENV_INSTALL" == false &&
              "$MEETING3_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$MEETING3_MIGRATION" == false && -z "$MEETING3_MIGRATION_HASH" ]]
          fi
          if [[ "$COLLABORATION_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CLOSURE_ENABLE" == false &&
              "$CLOSURE_MIGRATION" == false && "$IDENTITY_ACL_REPAIR" == false &&
              "$BILLING_MIGRATION" == false && "$CUSTOM_ROLES_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$MAIL_MIGRATION" == false && "$FILE_IMPORTS_MIGRATION" == false &&
              "$PLANNER_MIGRATION" == false && "$UX_MIGRATION" == false && "$MAIL_ENV_INSTALL" == false &&
              "$COLLABORATION_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ "$COLLABORATION_MIGRATION" == false && -z "$COLLABORATION_MIGRATION_HASH" ]]
          fi
          if [[ "$SALES_COMMERCE_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$SALES_COMMERCE_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$SALES_COMMERCE_MIGRATION_HASH" ]]
          fi
          if [[ "$INTAKE_NOTIFICATIONS_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$INTAKE_NOTIFICATIONS_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$INTAKE_NOTIFICATIONS_MIGRATION_HASH" ]]
          fi
          if [[ "$CLOSURE_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$BILLING_MIGRATION" == false &&
              "$SALES_COMMERCE_MIGRATION" == false && "$INTAKE_NOTIFICATIONS_MIGRATION" == false &&
              "$CLOSURE_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$CLOSURE_MIGRATION_HASH" ]]
          fi
          if [[ "$IDENTITY_ACL_REPAIR" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/prod_0.1.0 && "$TARGET" == backend &&
              "$CUTOVER" == false && "$BILLING_MIGRATION" == false &&
              "$CUSTOM_ROLES_MIGRATION" == false && "$SALES_COMMERCE_MIGRATION" == false &&
              "$INTAKE_NOTIFICATIONS_MIGRATION" == false && "$CLOSURE_MIGRATION" == false &&
              "$CLOSURE_ENABLE" == false && "$IDENTITY_ENV_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$IDENTITY_ENV_HASH" ]]
          fi
          if [[ "$CLOSURE_ENABLE" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/prod_0.1.0 && "$TARGET" == backend && "$CUTOVER" == false && "$BILLING_MIGRATION" == false &&
              "$CUSTOM_ROLES_MIGRATION" == false && "$SALES_COMMERCE_MIGRATION" == false &&
              "$INTAKE_NOTIFICATIONS_MIGRATION" == false && "$CLOSURE_MIGRATION" == false &&
              "$BACK_BEFORE_HASH" =~ ^[a-f0-9]{64}$ && "$BACK_HASH" =~ ^[a-f0-9]{64}$ &&
              "$BACK_BEFORE_HASH" != "$BACK_HASH" ]]
          else
            [[ -z "$BACK_BEFORE_HASH" ]]
          fi
          case "$TARGET" in
            all)
              echo 'Parallel backend/frontend release is forbidden for workspace closure' >&2
              exit 1
              ;;
            frontend)
              [[ "$FRONT_HASH" =~ ^[a-f0-9]{64}$ ]]
              echo 'matrix={"include":[{"role":"frontend","apps":"landing crm admin-panel"}]}' >> "$GITHUB_OUTPUT"
              ;;
            backend)
              [[ "$BACK_HASH" =~ ^[a-f0-9]{64}$ ]]
              echo 'matrix={"include":[{"role":"backend","apps":"api-gateway notification-delivery campaigns reporting billing identity platform support operations crm-access crm-intake crm-customers crm-sales"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nda17/aeroCRM_infra
          ref: ${{ inputs.infra_sha }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
          persist-credentials: false
      - name: Match the production Docker Engine for release regression tests
        uses: docker/setup-docker-action@v5
        with:
          version: v29.8.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Match the production Docker Compose for release regression tests
        uses: docker/setup-compose-action@v2
        with:
          version: v5.5.1
      - name: Require the reviewed production image store
        run: |
          node source/.github/scripts/backend-manifest.mjs docker-store
          compose_version=$(docker compose version --short)
          test "${compose_version#v}" = '5.5.1'
      - name: Validate reviewed release scripts
        run: |
          test "$(git -C infra rev-parse HEAD)" = "${{ inputs.infra_sha }}"
          test "$(git -C source rev-parse HEAD)" = "${{ needs.verify.outputs.sha }}"
          node --check source/.github/scripts/backend-manifest.mjs
          node --check source/.github/scripts/backend-images.mjs
          node --check infra/scripts/backend-release.mjs
          node --check infra/scripts/backend-release-state.mjs
          node --check infra/scripts/backend-release-transaction.mjs
          node --check infra/scripts/backend-mail-env.mjs
          bash -n infra/scripts/release.sh
          bash infra/scripts/release.sh --policy-self-test
          bash -n infra/scripts/aerocrm-nginx-release.sh
          bash -n infra/scripts/ensure-cutover-node.sh
          node --check infra/scripts/billing-capacity-migration.mjs
          node --check infra/scripts/crm-custom-roles-migration.mjs
          node --check infra/scripts/crm-corporate-mail-migration.mjs
          node --check infra/scripts/crm-file-imports-migration.mjs
          node --check infra/scripts/crm-planner-customization-migration.mjs
          node --check infra/scripts/crm-ux-unification-migration.mjs
          node --check infra/scripts/workspace-collaboration-migration.mjs
          node --check infra/scripts/meeting3-migration.mjs
          node --check infra/scripts/backend-chat-env.mjs
          node --check infra/scripts/chat-storage-probe.cjs
          node --check infra/scripts/crm-sales-commerce-migration.mjs
          node --check infra/scripts/crm-intake-notifications-migration.mjs
          node --check infra/scripts/workspace-closure-migration.mjs
          node --check infra/scripts/workspace-closure-enable.mjs
          node --check infra/scripts/backend-rollback-compatibility-guard.mjs
          node infra/scripts/crm-sales-commerce-migration.mjs --policy-self-test
          node infra/scripts/crm-file-imports-migration.mjs --policy-self-test
          node infra/scripts/crm-planner-customization-migration.mjs --policy-self-test
          node infra/scripts/crm-ux-unification-migration.mjs --policy-self-test
          node infra/scripts/workspace-collaboration-migration.mjs --policy-self-test
          node infra/scripts/meeting3-migration.mjs --policy-self-test
          node infra/scripts/crm-intake-notifications-migration.mjs --policy-self-test
          node infra/scripts/workspace-closure-migration.mjs --policy-self-test
          node infra/scripts/workspace-closure-enable.mjs --policy-self-test
          node infra/scripts/backend-rollback-compatibility-guard.mjs --policy-self-test
          # This release gate covers the introduced state, transaction and real Compose regressions.
          REQUIRE_DOCKER_COMPOSE_TEST=true node --test infra/scripts/backend-release*.test.mjs infra/scripts/backend-mail-env.test.mjs infra/scripts/backend-chat-env.test.mjs
      - name: Stage private Chat env delta
        if: inputs.crm_chat_env_install
        env:
          CRM_ACCESS_CHAT_ENV_BUNDLE: ${{ secrets.CRM_ACCESS_CHAT_ENV_BUNDLE }}
          CHAT_ENV_BUNDLE_HASH: ${{ inputs.crm_chat_env_bundle_hash }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node infra/scripts/backend-chat-env.mjs --stage "$RUNNER_TEMP/crm-access-chat-env.json" "$CHAT_ENV_BUNDLE_HASH"
      - name: Stage reviewed private Customers env bundle
        if: inputs.crm_mail_env_install
        env:
          CRM_CUSTOMERS_MAIL_ENV_BUNDLE: ${{ secrets.CRM_CUSTOMERS_MAIL_ENV_BUNDLE }}
          MAIL_ENV_BUNDLE_HASH: ${{ inputs.crm_mail_env_bundle_hash }}
        run: |
          set -euo pipefail
          umask 077
          node infra/scripts/backend-mail-env.mjs --stage "$RUNNER_TEMP/crm-customers-mail-env.json" "$MAIL_ENV_BUNDLE_HASH"
      - name: Download exact CI frontend artifacts
        if: matrix.role == 'frontend'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          APPS: ${{ matrix.apps }}
        run: |
          set -euo pipefail
          mkdir -p images
          for app in $APPS; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-$app" --dir "images/$app"
            test -s "images/$app/$app.tar.gz"
          done
      - name: Download and verify complete backend manifest and inherited CI origins
        if: matrix.role == 'backend'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SHA: ${{ needs.verify.outputs.sha }}
          REQUIRE_UNIFORM: ${{ (inputs.billing_capacity_migration || inputs.crm_custom_roles_migration || inputs.crm_sales_commerce_migration || inputs.crm_intake_notifications_migration || inputs.crm_corporate_mail_migration || inputs.crm_file_imports_migration || inputs.crm_planner_customization_migration || inputs.crm_ux_unification_migration || inputs.crm_workspace_collaboration_migration || inputs.crm_meeting3_migration || inputs.workspace_closure_migration || inputs.workspace_closure_identity_acl_repair || inputs.workspace_closure_enable || inputs.crm_contracts_cutover) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name backend-manifest --dir manifest
          node source/.github/scripts/backend-manifest.mjs verify manifest/backend-manifest.json
      - name: Load images and release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          INFRA_SHA: ${{ inputs.infra_sha }}
          ROLE: ${{ matrix.role }}
          APPS: ${{ matrix.apps }}
          SHA: ${{ needs.verify.outputs.sha }}
          FRONT_HOST: ${{ secrets.FRONTEND_SSH_HOST }}
          FRONT_USER: ${{ secrets.FRONTEND_SSH_USER }}
          FRONT_PORT: ${{ secrets.FRONTEND_SSH_PORT }}
          FRONT_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          BACK_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          BACK_USER: ${{ secrets.BACKEND_SSH_USER }}
          BACK_PORT: ${{ secrets.BACKEND_SSH_PORT }}
          BACK_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          FRONT_HASH: ${{ inputs.frontend_env_hash }}
          BACK_HASH: ${{ inputs.backend_env_hash }}
          BILLING_MIGRATION: ${{ inputs.billing_capacity_migration && 'true' || 'false' }}
          BILLING_MIGRATION_HASH: ${{ inputs.billing_migration_env_hash }}
          CUSTOM_ROLES_MIGRATION: ${{ inputs.crm_custom_roles_migration && 'true' || 'false' }}
          CUSTOM_ROLES_MIGRATION_HASH: ${{ inputs.crm_custom_roles_migration_env_hash }}
          SALES_COMMERCE_MIGRATION: ${{ inputs.crm_sales_commerce_migration && 'true' || 'false' }}
          SALES_COMMERCE_MIGRATION_HASH: ${{ inputs.crm_sales_commerce_migration_env_hash }}
          INTAKE_NOTIFICATIONS_MIGRATION: ${{ inputs.crm_intake_notifications_migration && 'true' || 'false' }}
          INTAKE_NOTIFICATIONS_MIGRATION_HASH: ${{ inputs.crm_intake_notifications_migration_env_hash }}
          MAIL_MIGRATION: ${{ inputs.crm_corporate_mail_migration && 'true' || 'false' }}
          MAIL_ENV_INSTALL: ${{ inputs.crm_mail_env_install && 'true' || 'false' }}
          MAIL_ENV_BEFORE_HASH: ${{ inputs.crm_mail_env_before_hash }}
          MAIL_ENV_BUNDLE_HASH: ${{ inputs.crm_mail_env_bundle_hash }}
          CHAT_ENV_INSTALL: ${{ inputs.crm_chat_env_install && 'true' || 'false' }}
          CHAT_ENV_BEFORE_HASH: ${{ inputs.crm_chat_env_before_hash }}
          CHAT_ENV_BUNDLE_HASH: ${{ inputs.crm_chat_env_bundle_hash }}
          MAIL_MIGRATION_HASH: ${{ inputs.crm_corporate_mail_migration_env_hash }}
          FILE_IMPORTS_MIGRATION: ${{ inputs.crm_file_imports_migration && 'true' || 'false' }}
          FILE_IMPORTS_MIGRATION_HASH: ${{ inputs.crm_file_imports_migration_env_hash }}
          PLANNER_MIGRATION: ${{ inputs.crm_planner_customization_migration && 'true' || 'false' }}
          PLANNER_MIGRATION_HASH: ${{ inputs.crm_planner_customization_migration_env_hash }}
          UX_MIGRATION: ${{ inputs.crm_ux_unification_migration && 'true' || 'false' }}
          UX_MIGRATION_HASH: ${{ inputs.crm_ux_unification_migration_env_hash }}
          COLLABORATION_MIGRATION: ${{ inputs.crm_workspace_collaboration_migration && 'true' || 'false' }}
          COLLABORATION_MIGRATION_HASH: ${{ inputs.crm_workspace_collaboration_migration_env_hash }}
          MEETING3_MIGRATION: ${{ inputs.crm_meeting3_migration && 'true' || 'false' }}
          MEETING3_MIGRATION_HASH: ${{ inputs.crm_meeting3_migration_env_hash }}
          CLOSURE_MIGRATION: ${{ inputs.workspace_closure_migration && 'true' || 'false' }}
          CLOSURE_MIGRATION_HASH: ${{ inputs.workspace_closure_migration_env_hash }}
          IDENTITY_ACL_REPAIR: ${{ inputs.workspace_closure_identity_acl_repair && 'true' || 'false' }}
          IDENTITY_ENV_HASH: ${{ inputs.workspace_closure_identity_env_hash }}
          CLOSURE_ENABLE: ${{ inputs.workspace_closure_enable && 'true' || 'false' }}
          BACK_BEFORE_HASH: ${{ inputs.backend_env_before_hash }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CUTOVER: ${{ inputs.crm_contracts_cutover && 'true' || 'false' }}
          RESUME: ${{ inputs.crm_contracts_cutover_resume && 'true' || 'false' }}
          STAGED_DIR: ${{ inputs.crm_contracts_staged_env_dir }}
          STAGED_HASH: ${{ inputs.crm_contracts_staged_env_hash }}
          DEFINITIONS_FILE: ${{ inputs.crm_contracts_definitions_file }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ "$ROLE" = frontend ]; then
            host="$FRONT_HOST"; user="$FRONT_USER"; hash="$FRONT_HASH"; port="$FRONT_PORT"
            printf '%s\n' "$FRONT_KEY" > ~/.ssh/release_key
          else
            host="$BACK_HOST"; user="$BACK_USER"; hash="$BACK_HASH"; port="$BACK_PORT"
            printf '%s\n' "$BACK_KEY" > ~/.ssh/release_key
          fi
          [[ "$hash" =~ ^[a-f0-9]{64}$ && "$port" =~ ^[0-9]{1,5}$ ]]
          chmod 600 ~/.ssh/release_key
          dest="$user@$host"
          stage="/opt/aerocrm/releases/staging/$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "$ROLE" = backend ] && { [ "$CUTOVER" = true ] || [ "$CLOSURE_ENABLE" = true ]; }; then
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" \
              "bash -c 'set -euo pipefail; if test -e /opt/aerocrm/releases/backend-state.json; then echo Historical cutover/enable is forbidden after canonical backend state adoption >&2; exit 1; fi'"
          fi
          if [ "$ROLE" = frontend ]; then
            backend_key="$RUNNER_TEMP/aerocrm_backend_check_key"
            printf '%s\n' "$BACK_KEY" > "$backend_key"
            chmod 600 "$backend_key"
            ssh -i "$backend_key" -p "$BACK_PORT" -o StrictHostKeyChecking=yes "$BACK_USER@$BACK_HOST" \
              "bash -c 'set -euo pipefail; cd /opt/aerocrm; for pending in backend-release.pending.json crm-contract-cutover.pending backend-rollback-blocked.pending; do test ! -e releases/\$pending; done; if test -e releases/backend-state.json; then cat releases/backend-state.json; else test \"\$(cat releases/backend.sha)\" = \"$SHA\"; test \"\$(cat releases/workspace-closure-enabled.sha)\" = \"$SHA\"; printf legacy; fi'" > "$RUNNER_TEMP/backend-frontend-gate.json"
            node source/.github/scripts/backend-manifest.mjs frontend-gate "$RUNNER_TEMP/backend-frontend-gate.json" "$SHA"
            rm -f "$backend_key"
          fi
          if [ "$ROLE" = backend ]; then
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "umask 077; mkdir -p /opt/aerocrm/releases/staging && mkdir '$stage'"
            scp -r -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/compose infra/scripts "$dest:$stage/"
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes manifest/backend-manifest.json "$dest:$stage/"
            if [ "$CHAT_ENV_INSTALL" = true ]; then
              scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes "$RUNNER_TEMP/crm-access-chat-env.json" "$dest:$stage/crm-access-chat-env.json"
            fi
            if [ "$MAIL_ENV_INSTALL" = true ]; then
              scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes "$RUNNER_TEMP/crm-customers-mail-env.json" "$dest:$stage/crm-customers-mail-env.json"
            fi
            if [ "$CUTOVER" = true ] || [ "$CLOSURE_ENABLE" = true ]; then
              ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" \
                "flock -n /opt/aerocrm/release.lock bash -c 'set -euo pipefail; test ! -e /opt/aerocrm/releases/backend-state.json; mkdir -p /opt/aerocrm/compose /opt/aerocrm/scripts; cp \"$stage/compose/backend.yml\" /opt/aerocrm/compose/backend.yml; cp \"$stage/compose/rabbitmq.conf\" /opt/aerocrm/compose/rabbitmq.conf; cp \"$stage/scripts/\"* /opt/aerocrm/scripts/'"
            fi
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --rollback-guard")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          else
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'mkdir -p /opt/aerocrm/compose /opt/aerocrm/scripts /opt/aerocrm/nginx'
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/compose/frontend.yml "$dest:/opt/aerocrm/compose/"
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/nginx/frontends.conf "$dest:/opt/aerocrm/nginx/"
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/release.sh "$dest:/opt/aerocrm/scripts/"
          fi
          if [ "$ROLE" = backend ] && [ "$CUTOVER" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh'")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "bash -c 'set -euo pipefail; cd /opt/aerocrm; actual=\$(cd env/backend && find . -maxdepth 1 -type f -name \"*.env\" -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d\" \" -f1); staged=\$(cd \"$STAGED_DIR/backend\" && find . -maxdepth 1 -type f -name \"*.env\" -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d\" \" -f1); test \"\$actual\" = \"$BACK_HASH\"; test \"\$staged\" = \"$STAGED_HASH\"; test -f \"$STAGED_DIR/migrations/identity.env\"; test -f \"$STAGED_DIR/migrations/notification-delivery.env\"; test -f \"$DEFINITIONS_FILE\"'"
          fi
          if [ "$ROLE" = backend ] && [ "$BILLING_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --billing")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$CUSTOM_ROLES_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-custom-roles")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$SALES_COMMERCE_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-sales-commerce")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$MAIL_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-corporate-mail")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$FILE_IMPORTS_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-file-imports")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$PLANNER_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-planner-customization")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$INTAKE_NOTIFICATIONS_MIGRATION" = true ]; then
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-intake-notifications")
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ]; then
            IMAGE_SSH_DEST="$dest" IMAGE_SSH_PORT="$port" IMAGE_SSH_KEY="$HOME/.ssh/release_key" \
              node source/.github/scripts/backend-images.mjs manifest/backend-manifest.json
          else
            for app in $APPS; do
              cat "images/$app/$app.tar.gz" | ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'set -o pipefail; gzip -dc | docker load >/dev/null'
            done
          fi
          if [ "$ROLE" = backend ] && [ "$CLOSURE_ENABLE" = true ]; then
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" \
              "cd /opt/aerocrm && flock -n release.lock '$node_bin' '$stage/scripts/workspace-closure-enable.mjs' '$SHA' '$BACK_BEFORE_HASH' '$BACK_HASH'"
          fi
          if [ "$ROLE" = backend ] && [ "$CUTOVER" = true ]; then
            resume_arg=
            if [ "$RESUME" = true ]; then resume_arg=' --resume'; fi
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "cd /opt/aerocrm && REVIEWED_INFRA_DIR='$stage' '$node_bin' '$stage/scripts/crm-contract-cutover.mjs' '$SHA' '$STAGED_DIR' '$DEFINITIONS_FILE'$resume_arg"
          elif [ "$ROLE" = backend ]; then
            manifest_env="BACKEND_MANIFEST_PATH='$stage/backend-manifest.json' INFRA_SHA='$INFRA_SHA' CI_RUN_ID='$RUN_ID'"
            if [ "$MAIL_ENV_INSTALL" = true ]; then
              manifest_env="$manifest_env CRM_MAIL_ENV_INSTALL='true' CRM_MAIL_ENV_BEFORE_HASH='$MAIL_ENV_BEFORE_HASH' CRM_MAIL_ENV_BUNDLE_HASH='$MAIL_ENV_BUNDLE_HASH'"
            fi
            if [ "$CHAT_ENV_INSTALL" = true ]; then
              manifest_env="$manifest_env CRM_CHAT_ENV_INSTALL='true' CRM_CHAT_ENV_BEFORE_HASH='$CHAT_ENV_BEFORE_HASH' CRM_CHAT_ENV_BUNDLE_HASH='$CHAT_ENV_BUNDLE_HASH'"
            fi
            if [[ "$UX_MIGRATION" == true ]]; then
              node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --crm-ux-unification")
            fi
            if [[ "$COLLABORATION_MIGRATION" == true ]]; then
              node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --workspace-collaboration")
            fi
            if [[ "$MEETING3_MIGRATION" == true ]]; then
              node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "REVIEWED_INFRA_DIR='$stage' bash '$stage/scripts/ensure-cutover-node.sh' --meeting3")
            fi
            if [ "$CLOSURE_ENABLE" = true ]; then manifest_env=; fi
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "cd /opt/aerocrm && $manifest_env REVIEWED_INFRA_DIR='$stage' '$stage/scripts/release.sh' '$ROLE' '$SHA' '$hash' '$BILLING_MIGRATION' '$BILLING_MIGRATION_HASH' '$CUSTOM_ROLES_MIGRATION' '$CUSTOM_ROLES_MIGRATION_HASH' '$SALES_COMMERCE_MIGRATION' '$SALES_COMMERCE_MIGRATION_HASH' '$INTAKE_NOTIFICATIONS_MIGRATION' '$INTAKE_NOTIFICATIONS_MIGRATION_HASH' '$CLOSURE_MIGRATION' '$CLOSURE_MIGRATION_HASH' '$IDENTITY_ACL_REPAIR' '$IDENTITY_ENV_HASH' '$MAIL_MIGRATION' '$MAIL_MIGRATION_HASH' '$FILE_IMPORTS_MIGRATION' '$FILE_IMPORTS_MIGRATION_HASH' '$PLANNER_MIGRATION' '$PLANNER_MIGRATION_HASH' '$UX_MIGRATION' '$UX_MIGRATION_HASH' '$COLLABORATION_MIGRATION' '$COLLABORATION_MIGRATION_HASH' '$MEETING3_MIGRATION' '$MEETING3_MIGRATION_HASH'"
          else
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "/opt/aerocrm/scripts/release.sh '$ROLE' '$SHA' '$hash'"
          fi
      - name: Remove runner private Customers bundle
        if: always() && inputs.crm_mail_env_install
        run: rm -f "$RUNNER_TEMP/crm-customers-mail-env.json"
      - name: Remove runner private Chat bundle
        if: always() && inputs.crm_chat_env_install
        run: rm -f "$RUNNER_TEMP/crm-access-chat-env.json"
