name: aeroCRM release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [all, frontend, backend]
        default: all
        required: true
      ci_run_id:
        description: Green CI run ID for this exact commit
        required: true
      sha:
        description: Full 40-character commit SHA
        required: true
      frontend_env_hash:
        description: SHA-256 of sorted frontend env-file hashes on VPS
        required: false
      infra_sha:
        description: Full commit SHA of reviewed private infra repo
        required: true
      backend_env_hash:
        description: SHA-256 of sorted backend env-file hashes on VPS
        required: false
      billing_capacity_migration:
        description: Backend target only; apply reviewed Billing capacity and administrative-seat migrations before switching images
        type: boolean
        default: false
        required: true
      billing_migration_env_hash:
        description: SHA-256 of the private VPS migrations/billing.env file; required only for Billing capacity migration
        required: false
      crm_custom_roles_migration:
        description: Backend target only; apply reviewed CRM Access custom-role and administrative-seat migrations with the write gate disabled
        type: boolean
        default: false
        required: true
      crm_custom_roles_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-access.env file; required only for the CRM custom-role migration
        required: false
      crm_sales_commerce_migration:
        description: Backend target only; apply the reviewed CRM Sales commerce migration before switching images
        type: boolean
        default: false
        required: true
      crm_sales_commerce_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-sales.env file; required only for the CRM Sales commerce migration
        required: false
      crm_intake_notifications_migration:
        description: Backend target only; apply the reviewed CRM Intake inbox notification ID default migration before switching images
        type: boolean
        default: false
        required: true
      crm_intake_notifications_migration_env_hash:
        description: SHA-256 of the private VPS migrations/crm-intake.env file; required only for the CRM Intake notification migration
        required: false
      crm_contracts_cutover:
        description: Backend target only; release frontend separately after a successful CRM contract cutover
        type: boolean
        default: false
        required: true
      crm_contracts_cutover_resume:
        description: Resume the same reviewed cutover after a guarded rollback
        type: boolean
        default: false
        required: true
      crm_contracts_staged_env_dir:
        description: Absolute private VPS directory containing backend/ and migrations/
        required: false
      crm_contracts_staged_env_hash:
        description: SHA-256 of sorted staged backend env-file hashes on VPS
        required: false
      crm_contracts_definitions_file:
        description: Absolute private VPS path to reviewed RabbitMQ definitions JSON
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: aerocrm-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Require green exact-SHA CI on production branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SHA: ${{ inputs.sha }}
          INFRA_SHA: ${{ inputs.infra_sha }}
          TARGET: ${{ inputs.target }}
          FRONT_HASH: ${{ inputs.frontend_env_hash }}
          BACK_HASH: ${{ inputs.backend_env_hash }}
          BILLING_MIGRATION: ${{ inputs.billing_capacity_migration && 'true' || 'false' }}
          BILLING_MIGRATION_HASH: ${{ inputs.billing_migration_env_hash }}
          CUSTOM_ROLES_MIGRATION: ${{ inputs.crm_custom_roles_migration && 'true' || 'false' }}
          CUSTOM_ROLES_MIGRATION_HASH: ${{ inputs.crm_custom_roles_migration_env_hash }}
          SALES_COMMERCE_MIGRATION: ${{ inputs.crm_sales_commerce_migration && 'true' || 'false' }}
          SALES_COMMERCE_MIGRATION_HASH: ${{ inputs.crm_sales_commerce_migration_env_hash }}
          INTAKE_NOTIFICATIONS_MIGRATION: ${{ inputs.crm_intake_notifications_migration && 'true' || 'false' }}
          INTAKE_NOTIFICATIONS_MIGRATION_HASH: ${{ inputs.crm_intake_notifications_migration_env_hash }}
          CUTOVER: ${{ inputs.crm_contracts_cutover && 'true' || 'false' }}
          RESUME: ${{ inputs.crm_contracts_cutover_resume && 'true' || 'false' }}
          STAGED_DIR: ${{ inputs.crm_contracts_staged_env_dir }}
          STAGED_HASH: ${{ inputs.crm_contracts_staged_env_hash }}
          DEFINITIONS_FILE: ${{ inputs.crm_contracts_definitions_file }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INFRA_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          read -r conclusion head_sha branch workflow_path <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.conclusion,.head_sha,.head_branch,.path] | join(" ")')"
          [[ "$conclusion" == success && "$head_sha" == "$SHA" && "$branch" == prod_0.1.0 && "$workflow_path" == .github/workflows/ci.yml ]]
          if [[ "$CUTOVER" == true ]]; then
            [[ "$TARGET" == backend ]]
            [[ "$STAGED_HASH" =~ ^[a-f0-9]{64}$ ]]
            [[ "$STAGED_DIR" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEFINITIONS_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]]
            [[ "/$STAGED_DIR/" != *'/../'* && "/$DEFINITIONS_FILE/" != *'/../'* ]]
            [[ "$STAGED_DIR" != *'//'* && "$DEFINITIONS_FILE" != *'//'* ]]
          else
            [[ "$RESUME" == false && -z "$STAGED_DIR" && -z "$STAGED_HASH" && -z "$DEFINITIONS_FILE" ]]
          fi
          if [[ "$BILLING_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$BILLING_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$BILLING_MIGRATION_HASH" ]]
          fi
          [[ "$BILLING_MIGRATION" == "$CUSTOM_ROLES_MIGRATION" ]]
          if [[ "$CUSTOM_ROLES_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$CUSTOM_ROLES_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$CUSTOM_ROLES_MIGRATION_HASH" ]]
          fi
          if [[ "$SALES_COMMERCE_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$SALES_COMMERCE_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$SALES_COMMERCE_MIGRATION_HASH" ]]
          fi
          if [[ "$INTAKE_NOTIFICATIONS_MIGRATION" == true ]]; then
            [[ "$TARGET" == backend && "$CUTOVER" == false && "$INTAKE_NOTIFICATIONS_MIGRATION_HASH" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$INTAKE_NOTIFICATIONS_MIGRATION_HASH" ]]
          fi
          case "$TARGET" in
            all)
              [[ "$FRONT_HASH" =~ ^[a-f0-9]{64}$ && "$BACK_HASH" =~ ^[a-f0-9]{64}$ ]]
              echo 'matrix={"include":[{"role":"frontend","apps":"landing crm admin-panel"},{"role":"backend","apps":"api-gateway notification-delivery campaigns reporting billing identity platform support operations crm-access crm-intake crm-customers crm-sales"}]}' >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              [[ "$FRONT_HASH" =~ ^[a-f0-9]{64}$ ]]
              echo 'matrix={"include":[{"role":"frontend","apps":"landing crm admin-panel"}]}' >> "$GITHUB_OUTPUT"
              ;;
            backend)
              [[ "$BACK_HASH" =~ ^[a-f0-9]{64}$ ]]
              echo 'matrix={"include":[{"role":"backend","apps":"api-gateway notification-delivery campaigns reporting billing identity platform support operations crm-access crm-intake crm-customers crm-sales"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nda17/aeroCRM_infra
          ref: ${{ inputs.infra_sha }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
          persist-credentials: false
      - name: Validate reviewed release scripts
        run: |
          bash -n infra/scripts/release.sh
          bash -n infra/scripts/aerocrm-nginx-release.sh
          bash -n infra/scripts/ensure-cutover-node.sh
          node --check infra/scripts/billing-capacity-migration.mjs
          node --check infra/scripts/crm-custom-roles-migration.mjs
          node --check infra/scripts/crm-sales-commerce-migration.mjs
          node --check infra/scripts/crm-intake-notifications-migration.mjs
          node --check infra/scripts/backend-rollback-compatibility-guard.mjs
          node infra/scripts/crm-sales-commerce-migration.mjs --policy-self-test
          node infra/scripts/crm-intake-notifications-migration.mjs --policy-self-test
          node infra/scripts/backend-rollback-compatibility-guard.mjs --policy-self-test
      - name: Download exact CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          APPS: ${{ matrix.apps }}
        run: |
          set -euo pipefail
          mkdir -p images
          for app in $APPS; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-$app" --dir "images/$app"
            test -s "images/$app/$app.tar.gz"
          done
      - name: Load images and release
        env:
          ROLE: ${{ matrix.role }}
          APPS: ${{ matrix.apps }}
          SHA: ${{ needs.verify.outputs.sha }}
          FRONT_HOST: ${{ secrets.FRONTEND_SSH_HOST }}
          FRONT_USER: ${{ secrets.FRONTEND_SSH_USER }}
          FRONT_PORT: ${{ secrets.FRONTEND_SSH_PORT }}
          FRONT_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          BACK_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          BACK_USER: ${{ secrets.BACKEND_SSH_USER }}
          BACK_PORT: ${{ secrets.BACKEND_SSH_PORT }}
          BACK_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          FRONT_HASH: ${{ inputs.frontend_env_hash }}
          BACK_HASH: ${{ inputs.backend_env_hash }}
          BILLING_MIGRATION: ${{ inputs.billing_capacity_migration && 'true' || 'false' }}
          BILLING_MIGRATION_HASH: ${{ inputs.billing_migration_env_hash }}
          CUSTOM_ROLES_MIGRATION: ${{ inputs.crm_custom_roles_migration && 'true' || 'false' }}
          CUSTOM_ROLES_MIGRATION_HASH: ${{ inputs.crm_custom_roles_migration_env_hash }}
          SALES_COMMERCE_MIGRATION: ${{ inputs.crm_sales_commerce_migration && 'true' || 'false' }}
          SALES_COMMERCE_MIGRATION_HASH: ${{ inputs.crm_sales_commerce_migration_env_hash }}
          INTAKE_NOTIFICATIONS_MIGRATION: ${{ inputs.crm_intake_notifications_migration && 'true' || 'false' }}
          INTAKE_NOTIFICATIONS_MIGRATION_HASH: ${{ inputs.crm_intake_notifications_migration_env_hash }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CUTOVER: ${{ inputs.crm_contracts_cutover && 'true' || 'false' }}
          RESUME: ${{ inputs.crm_contracts_cutover_resume && 'true' || 'false' }}
          STAGED_DIR: ${{ inputs.crm_contracts_staged_env_dir }}
          STAGED_HASH: ${{ inputs.crm_contracts_staged_env_hash }}
          DEFINITIONS_FILE: ${{ inputs.crm_contracts_definitions_file }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ "$ROLE" = frontend ]; then
            host="$FRONT_HOST"; user="$FRONT_USER"; hash="$FRONT_HASH"; port="$FRONT_PORT"
            printf '%s\n' "$FRONT_KEY" > ~/.ssh/release_key
          else
            host="$BACK_HOST"; user="$BACK_USER"; hash="$BACK_HASH"; port="$BACK_PORT"
            printf '%s\n' "$BACK_KEY" > ~/.ssh/release_key
          fi
          [[ "$hash" =~ ^[a-f0-9]{64}$ && "$port" =~ ^[0-9]{1,5}$ ]]
          dest="$user@$host"
          ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'mkdir -p /opt/aerocrm/compose /opt/aerocrm/scripts'
          scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes "infra/compose/$ROLE.yml" "$dest:/opt/aerocrm/compose/"
          if [ "$ROLE" = frontend ]; then
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'mkdir -p /opt/aerocrm/nginx'
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/nginx/frontends.conf "$dest:/opt/aerocrm/nginx/"
          fi
          if [ "$ROLE" = backend ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/compose/rabbitmq.conf "$dest:/opt/aerocrm/compose/"
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/backend-rollback-compatibility-guard.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh --rollback-guard')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/release.sh "$dest:/opt/aerocrm/scripts/"
          if [ "$ROLE" = backend ] && [ "$CUTOVER" = true ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/crm-contract-cutover.mjs infra/scripts/crm-contract-cutover-preflight.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "bash -c 'set -euo pipefail; cd /opt/aerocrm; actual=\$(cd env/backend && find . -maxdepth 1 -type f -name \"*.env\" -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d\" \" -f1); staged=\$(cd \"$STAGED_DIR/backend\" && find . -maxdepth 1 -type f -name \"*.env\" -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d\" \" -f1); test \"\$actual\" = \"$BACK_HASH\"; test \"\$staged\" = \"$STAGED_HASH\"; test -f \"$STAGED_DIR/migrations/identity.env\"; test -f \"$STAGED_DIR/migrations/notification-delivery.env\"; test -f \"$DEFINITIONS_FILE\"'"
          fi
          if [ "$ROLE" = backend ] && [ "$BILLING_MIGRATION" = true ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/billing-capacity-migration.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh --billing')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$CUSTOM_ROLES_MIGRATION" = true ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/crm-custom-roles-migration.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh --crm-custom-roles')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$SALES_COMMERCE_MIGRATION" = true ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/crm-sales-commerce-migration.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh --crm-sales-commerce')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          if [ "$ROLE" = backend ] && [ "$INTAKE_NOTIFICATIONS_MIGRATION" = true ]; then
            scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes infra/scripts/crm-intake-notifications-migration.mjs infra/scripts/ensure-cutover-node.sh "$dest:/opt/aerocrm/scripts/"
            node_bin=$(ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'bash /opt/aerocrm/scripts/ensure-cutover-node.sh --crm-intake-notifications')
            [[ "$node_bin" == /opt/aerocrm/tools/node-v22.23.2-linux-x64/bin/node ]]
          fi
          for app in $APPS; do
            gzip -dc "images/$app/$app.tar.gz" | ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" 'docker load >/dev/null'
          done
          if [ "$ROLE" = backend ] && [ "$CUTOVER" = true ]; then
            resume_arg=
            if [ "$RESUME" = true ]; then resume_arg=' --resume'; fi
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "cd /opt/aerocrm && '$node_bin' scripts/crm-contract-cutover.mjs '$SHA' '$STAGED_DIR' '$DEFINITIONS_FILE'$resume_arg"
          elif [ "$ROLE" = backend ]; then
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "/opt/aerocrm/scripts/release.sh '$ROLE' '$SHA' '$hash' '$BILLING_MIGRATION' '$BILLING_MIGRATION_HASH' '$CUSTOM_ROLES_MIGRATION' '$CUSTOM_ROLES_MIGRATION_HASH' '$SALES_COMMERCE_MIGRATION' '$SALES_COMMERCE_MIGRATION_HASH' '$INTAKE_NOTIFICATIONS_MIGRATION' '$INTAKE_NOTIFICATIONS_MIGRATION_HASH'"
          else
            ssh -i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes "$dest" "/opt/aerocrm/scripts/release.sh '$ROLE' '$SHA' '$hash'"
          fi
