<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#4c165e" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<title>Нет подключения — aeroCRM</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family: system-ui, sans-serif;
				color: #24192b;
				background: #faf8fb;
			}
			main {
				width: 100%;
				max-width: 420px;
				text-align: center;
			}
			.brand {
				font-size: 20px;
				font-weight: 700;
				color: #4c165e;
			}
			h1 {
				font-size: 28px;
				line-height: 1.2;
				margin: 24px 0 12px;
			}
			p {
				line-height: 1.6;
			}
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 48px;
				margin-top: 16px;
				padding: 12px 20px;
				border-radius: 12px;
				color: #fff;
				background: #4c165e;
				font-weight: 600;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #efc85b;
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand">aeroCRM</div>
			<h1>Нет подключения</h1>
			<p>
				Для работы с CRM нужен интернет. Проверьте подключение и попробуйте
				снова.
			</p>
			<a href="">Попробовать снова</a>
		</main>
	</body>
</html>
